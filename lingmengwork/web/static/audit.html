<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>灵梦work · 操作审计</title>
<style>
  :root{
    --bg:#0b0f1a; --bg2:#0e1424; --panel:rgba(20,28,48,.72); --panel2:rgba(14,20,36,.85);
    --line:rgba(120,150,220,.16); --txt:#e6ecff; --muted:#8b97c4; --brand:#7c9cff;
    --cyan:#39d0d8; --gold:#ffcb6b; --rose:#ff7eb6; --green:#5ee6a8; --red:#ff6b81;
    --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:
      radial-gradient(1200px 600px at 12% -10%, rgba(124,156,255,.18), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(57,208,216,.12), transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--txt); font:14px/1.55 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 60px}
  .head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .brand{font-size:26px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,#cdd9ff,#7c9cff 45%,#39d0d8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:13px}
  .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 18px}
  .kpi .c{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .n{font-size:24px;font-weight:800;color:var(--brand)}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  select,button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--brand);color:#fff}
  .status{color:var(--muted);font-size:12px;margin-left:auto}
  .tbl{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .row{display:grid;grid-template-columns:168px 110px 120px 1fr 70px;gap:10px;padding:11px 16px;align-items:center}
  .row.head{background:rgba(124,156,255,.10);color:var(--muted);font-size:12px;font-weight:700;
    position:sticky;top:0;border-bottom:1px solid var(--line)}
  .row.it{border-top:1px solid var(--line);transition:background .15s}
  .row.it:hover{background:rgba(124,156,255,.07)}
  .src{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .s-engine{background:rgba(124,156,255,.18);color:#aebfff}
  .s-automation{background:rgba(57,208,216,.16);color:#7fe6ec}
  .s-selfcheck{background:rgba(255,203,107,.16);color:#ffd98a}
  .s-system{background:rgba(255,126,182,.16);color:#ffb0d4}
  .kind{color:var(--muted);font-size:12px}
  .k-fail{color:var(--red);font-weight:700}
  .k-run{color:var(--green)}
  .k-create,.k-delete,.k-toggle{color:var(--gold)}
  .msg{color:var(--txt);font-size:13px}
  .ts{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .badge-audit{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;font-size:10px;
    background:rgba(255,107,129,.18);color:var(--red);font-weight:700;vertical-align:middle}
  .data-j{color:var(--muted);font-size:11px;cursor:pointer}
  .data-j:hover{color:var(--brand)}
  .pop{position:fixed;inset:0;background:rgba(4,8,18,.55);display:none;align-items:center;justify-content:center;z-index:50}
  .pop.show{display:flex}
  .pop pre{max-width:80vw;max-height:70vh;overflow:auto;background:#070b14;border:1px solid var(--line);
    border-radius:12px;padding:18px;color:#bfe;font-size:12px}
  @media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:88px 70px 1fr}.row .c-src,.row .c-kind{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand">🛡️ 操作审计</div>
    <div class="sub">关键操作审计链 · 落盘 JSONL + 启动回放 · 跨重启可追溯（Phase 17）</div>
  </div>

  <div class="kpi">
    <div class="c"><div class="n" id="kTotal">0</div><div class="l">审计事件总数</div></div>
    <div class="c"><div class="n" id="kEngine">0</div><div class="l">引擎操作</div></div>
    <div class="c"><div class="n" id="kAuto">0</div><div class="l">自动化调度</div></div>
    <div class="c"><div class="n" id="kOther">0</div><div class="l">自检/系统</div></div>
  </div>

  <div class="bar">
    <select id="fSource">
      <option value="">全部来源</option>
      <option value="engine">引擎</option>
      <option value="automation">自动化调度</option>
      <option value="selfcheck">离线自检</option>
      <option value="system">系统</option>
    </select>
    <button id="btnRefresh">立即刷新</button>
    <span class="status" id="status">就绪</span>
  </div>

  <div class="tbl">
    <div class="row head"><span>时间</span><span>来源</span><span>动作</span><span>消息</span><span>数据</span></div>
    <div id="feed"><div class="empty">加载中…</div></div>
  </div>
</div>

<div class="pop" id="pop"><pre id="popData"></pre></div>

<script>
const feed = document.getElementById('feed');
const statusEl = document.getElementById('status');
const fSource = document.getElementById('fSource');
let sinceId = 0;

function fmtTime(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
function srcClass(s){ return 's-'+(s||'system'); }
function kindClass(k){ if(/fail/i.test(k)) return 'k-fail'; if(/run/i.test(k)) return 'k-run';
  if(/create|delete|toggle/i.test(k)) return k.replace(/_/g,'-'); return ''; }

function render(rows){
  if(!rows.length){ feed.innerHTML = '<div class="empty">暂无审计事件（关键操作会被自动记录）</div>'; return; }
  let h = '';
  for(const e of rows){
    const kc = kindClass(e.kind);
    h += '<div class="row it">'
       + '<span class="ts">'+fmtTime(e.ts)+'</span>'
       + '<span><span class="src '+srcClass(e.source)+'">'+(e.source||'system')+'</span></span>'
       + '<span class="kind '+kc+'">'+e.kind+'</span>'
       + '<span class="msg">'+esc(e.msg)+(e.audit?'<span class="badge-audit">审计</span>':'')+'</span>'
       + '<span class="data-j" data-id="'+e.id+'">查看</span>'
       + '</div>';
  }
  feed.innerHTML = h;
  feed.querySelectorAll('.data-j').forEach(el=>{
    el.onclick = ()=>showData(rows.find(r=>r.id==el.dataset.id));
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function showData(ev){
  document.getElementById('popData').textContent = JSON.stringify(ev, null, 2);
  document.getElementById('pop').classList.add('show');
}
document.getElementById('pop').onclick = ()=>document.getElementById('pop').classList.remove('show');

function load(){
  statusEl.textContent = '同步中…';
  let url = '/api/audit?limit=200';
  if(fSource.value) url += '&source='+encodeURIComponent(fSource.value);
  if(sinceId) url += '&since='+sinceId;
  fetch(url).then(r=>r.json()).then(d=>{
    if(!d.ok){ statusEl.textContent = '获取失败'; return; }
    const rows = d.events || [];
    render(rows);
    // 统计
    const eng = rows.filter(e=>e.source==='engine').length;
    const auto = rows.filter(e=>e.source==='automation').length;
    const other = rows.length - eng - auto;
    document.getElementById('kTotal').textContent = rows.length;
    document.getElementById('kEngine').textContent = eng;
    document.getElementById('kAuto').textContent = auto;
    document.getElementById('kOther').textContent = other;
    if(rows.length) sinceId = Math.max(...rows.map(e=>e.id));
    statusEl.textContent = '已同步 '+new Date().toLocaleTimeString();
  }).catch(()=>{ statusEl.textContent = '连接失败'; });
}

fSource.onchange = ()=>{ sinceId=0; load(); };
document.getElementById('btnRefresh').onclick = ()=>{ sinceId=0; load(); };
load();
setInterval(load, 4000);
</script>
  <script src="/static/nav.js"></script>
  <script src="/static/theme.js"></script>
</body>
</html>
