<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自主模式 · 灵梦work</title>
<style>
  :root{
    --bg:#0b0f1a; --panel:rgba(255,255,255,.04); --panel-2:rgba(255,255,255,.06);
    --stroke:rgba(255,255,255,.10); --txt:#e6e9f2; --muted:#9aa3b8;
    --brand:#8b5cf6; --brand-2:#22d3ee; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(1100px 600px at 12% -8%, rgba(139,92,246,.18), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(34,211,238,.14), transparent 55%),
      var(--bg);
    color:var(--txt);font:14px/1.6 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 60px}
  header h1{margin:0 0 4px;font-size:23px;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{margin:0 0 18px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--stroke);border-radius:16px;padding:16px 18px;margin-bottom:16px}
  label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.6px}
  textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--stroke);border-radius:10px;color:var(--txt);
    padding:10px 12px;font:inherit;resize:vertical;outline:none;min-height:80px}
  textarea:focus{border-color:var(--brand)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  select{background:rgba(0,0,0,.25);border:1px solid var(--stroke);border-radius:10px;color:var(--txt);padding:8px 10px;font:inherit}
  button{cursor:pointer;border:1px solid var(--stroke);background:var(--panel-2);color:var(--txt);padding:9px 15px;border-radius:10px;font:inherit;transition:.16s}
  button:hover{background:rgba(255,255,255,.12)}
  button.primary{background:linear-gradient(90deg,var(--brand),var(--brand-2));border:none;color:#06121f;font-weight:700}
  button:disabled{opacity:.5;cursor:not-allowed}
  .status{color:var(--muted);font-size:12px;margin-top:8px;min-height:16px}
  .iter{border:1px solid var(--stroke);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:var(--panel-2)}
  .iter .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .iter .step{font-weight:700;color:#fff}
  .badge{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--stroke)}
  .badge.done{background:rgba(52,211,153,.16);color:var(--ok);border-color:transparent}
  .badge.cont{background:rgba(251,191,36,.14);color:var(--warn);border-color:transparent}
  .tag{font-size:11px;color:var(--muted)}
  .md{margin-top:4px}
  .md-h{margin:12px 0 5px;color:#fff;border-left:3px solid var(--brand);padding-left:10px;font-size:14px}
  .md-p{margin:5px 0}
  .md-li{margin:3px 0 3px 18px;list-style:none;position:relative}
  .md-li::before{content:"▸";position:absolute;left:-16px;color:var(--brand-2)}
  .md-code{background:rgba(0,0,0,.4);border:1px solid var(--stroke);border-radius:10px;padding:12px;overflow:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace}
  .md-ic{background:rgba(139,92,246,.18);border-radius:5px;padding:1px 5px;font-family:ui-monospace,monospace;font-size:12.5px}
  .md-sp{height:6px}
  .conclusion{margin-top:10px;padding:14px 16px;border-radius:14px;border:1px solid var(--brand);background:rgba(139,92,246,.10)}
  .conclusion h3{margin:0 0 6px;color:#fff}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>自主模式</h1>
    <p>目标驱动的自驱循环：规划 → 行动 → 观察 → Critic 评判 → 反思修正，直至达成。</p>
  </header>

  <div class="card">
    <label>总目标</label>
    <textarea id="goal" placeholder="例如：为灵梦work设计一套可自修复的错误自愈机制"></textarea>
    <div class="row">
      <label style="margin:0">自驱轮次</label>
      <select id="iters">
        <option value="3">3 轮（快速）</option>
        <option value="6" selected>6 轮（标准）</option>
        <option value="10">10 轮（深入）</option>
      </select>
      <button class="primary" id="run">🚀 启动自主循环</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div id="trace" class="hidden"></div>
  <div id="final" class="conclusion hidden">
    <h3 id="finalTitle"></h3>
    <div class="md" id="finalBody"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function inlineMd(t){
  let s = esc(t);
  s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  s = s.replace(/`([^`]+?)`/g, '<code class="md-ic">$1</code>');
  return s;
}
function renderMd(src){
  const lines = String(src||"").split(/\r?\n/);
  let html="", inCode=false, buf=[];
  const flush=()=>{ if(buf.length){ html+='<pre class="md-code"><code>'+esc(buf.join("\n"))+'</code></pre>'; buf=[]; } };
  for(const line of lines){
    if(/^\s*```/.test(line)){ if(inCode){flush();inCode=false;}else{inCode=true;} continue; }
    if(inCode){ buf.push(line); continue; }
    let m;
    if((m=line.match(/^(#{2,4})\s+(.*)$/))){ html+='<h'+(m[1].length)+' class="md-h">'+inlineMd(m[2])+'</h'+(m[1].length)+'>'; continue; }
    if(/^\d+[.、]\s+/.test(line)){ html+='<div class="md-li">'+inlineMd(line.replace(/^\d+[.、]\s+/,""))+'</div>'; continue; }
    if(/^[-*]\s+/.test(line)){ html+='<div class="md-li">'+inlineMd(line.replace(/^[-*]\s+/,""))+'</div>'; continue; }
    if(line.trim()===""){ html+='<div class="md-sp"></div>'; continue; }
    html+='<p class="md-p">'+inlineMd(line)+'</p>';
  }
  if(inCode) flush();
  return html;
}

async function run(){
  const goal = $("#goal").value.trim();
  if(!goal){ $("#status").textContent="请填写总目标"; return; }
  const maxIter = parseInt($("#iters").value, 10) || 6;
  const btn = $("#run"); btn.disabled=true;
  $("#trace").className="hidden"; $("#final").className="conclusion hidden";
  $("#status").textContent = "自主循环运行中（最多 "+maxIter+" 轮）…";
  try{
    const r = await fetch("/api/autonomous", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ goal, max_iter: maxIter })
    });
    const j = await r.json();
    if(!j.ok && !j.iterations){ $("#status").textContent="失败: "+(j.error||r.status); return; }
    renderTrace(j);
    $("#status").textContent = j.reached ? "✅ 自主循环在 "+(j.iterations||[]).length+" 轮内达成目标" : "⏳ 已达轮次上限，见最终结论";
  }catch(e){ $("#status").textContent="请求异常: "+e.message; }
  finally{ btn.disabled=false; }
}

function renderTrace(j){
  const wrap = $("#trace"); wrap.className=""; wrap.innerHTML="";
  (j.iterations||[]).forEach(it=>{
    const div = document.createElement("div"); div.className="iter";
    const c = it.critic||{};
    const badge = c.done ? '<span class="badge done">已达成</span>' : '<span class="badge cont">进行中</span>';
    div.innerHTML =
      '<div class="top"><span class="step">第 '+it.step+' 轮</span>'+badge
      +'<span class="tag">Critic '+ (c.score!=null?c.score:"-") +' · '+(c.note||"")+'</span></div>'
      +'<div class="md">'+renderMd(it.plan||"")+'</div>'
      +'<div class="md">'+renderMd(it.observation||"")+'</div>'
      + (it.reflection ? '<div class="md">'+renderMd("## 反思修正\n"+it.reflection)+'</div>' : "");
    wrap.appendChild(div);
  });
  if(j.conclusion){
    $("#finalTitle").textContent = j.reached ? "最终结论（目标已达成）" : "当前最优结论";
    $("#finalBody").innerHTML = renderMd(j.conclusion);
    $("#final").className = "conclusion";
  }
}

$("#run").onclick = run;
</script>
</body>
</html>
