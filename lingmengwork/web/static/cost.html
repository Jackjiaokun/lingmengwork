<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵梦work · 成本看板</title>
<style>
  :root{
    --bg:#070a14; --bg2:#0e1424; --card:rgba(20,27,48,.62); --card2:#1a2238;
    --line:rgba(126,146,210,.16); --txt:#e9edf8; --mut:#828caa; --acc:#7c5cff;
    --ok:#34e0a1; --warn:#ffb454; --fail:#ff5c7c; --brand2:#4dd0e1;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.45;
    background:
      radial-gradient(1100px 700px at 10% -10%, rgba(124,92,255,.14), transparent 60%),
      radial-gradient(900px 700px at 100% 0%, rgba(77,208,225,.10), transparent 55%),
      var(--bg);
    background-attachment:fixed}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;
    background:rgba(14,20,36,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);position:relative}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(124,92,255,.6),transparent)}
  header h1{font-size:17px;margin:0;font-weight:600}
  header h1 .ac{color:var(--acc)}
  .head-sp{flex:1}
  .head-meta{color:var(--mut);font-size:12px;display:flex;gap:16px;align-items:center}
  .switch{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;cursor:pointer}
  .switch input{accent-color:var(--acc)}
  a.btn{background:linear-gradient(135deg,#7c5cff,#5b8bff);border:1px solid transparent;color:#fff;
    padding:7px 14px;border-radius:9px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block;
    box-shadow:0 6px 20px rgba(124,92,255,.3);transition:transform .14s ease,filter .2s ease}
  a.btn:hover{transform:translateY(-1px);filter:brightness(1.08);border-color:transparent}
  main{max-width:1180px;margin:0 auto;padding:20px 22px 60px}
  section{margin-bottom:26px}
  .sec-title{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;
    margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:linear-gradient(180deg,#7c5cff,#4dd0e1);border-radius:2px}
  .top-cards{grid-template-columns:repeat(4,1fr)}
  .grid{display:grid;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:transform .15s ease,border-color .2s ease,box-shadow .2s ease}
  .card:hover{transform:translateY(-2px);border-color:rgba(124,92,255,.35);box-shadow:0 12px 36px rgba(0,0,0,.4)}
  .stat-lg{display:flex;flex-direction:column;gap:4px}
  .stat-lg .num{font-size:28px;font-weight:700;line-height:1}
  .stat-lg .lab{color:var(--mut);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:var(--bg2)}
  .mode-tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;background:rgba(78,161,255,.16);color:var(--acc)}
  .empty{padding:30px;text-align:center;color:var(--mut)}
  .pricetbl td.num{font-variant-numeric:tabular-nums}
  .hint{color:var(--mut);font-size:12px;margin-top:8px}
  /* 批次17 — 成本预警 */
  .stat-lg.alert{border-color:var(--fail);box-shadow:0 0 0 1px var(--fail) inset}
  .stat-lg.alert .num{color:var(--fail)}
  .alert-badge{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:20px;
    font-size:11px;font-weight:700;background:rgba(231,76,60,.18);color:var(--fail);vertical-align:middle}
  .thresh-note{color:var(--mut);font-size:12px;margin:-4px 0 14px}
  tr.over td{background:rgba(231,76,60,.12)}
  tr.over td.num:last-child{color:var(--fail);font-weight:700}
  .warn-ico{margin-left:5px}
</style>
</head>
<body>
<header>
  <h1>灵梦work · <span class="ac">成本看板</span></h1>
  <div class="head-sp"></div>
  <div class="head-meta"><span id="meta-time"></span></div>
  <a class="btn" href="/">← 返回控制台</a>
  <label class="switch"><input type="checkbox" id="auto" checked /> 自动刷新 (5s)</label>
</header>
  <div id="sibnav"></div>

<main>
  <section>
    <h2 class="sec-title">进程总计</h2>
    <div class="grid top-cards">
      <div class="card stat-lg"><span class="num" id="t-tok">0</span><span class="lab">估算总 Token</span></div>
      <div class="card stat-lg"><span class="num" id="t-in">0</span><span class="lab">输入 Token</span></div>
      <div class="card stat-lg"><span class="num" id="t-out">0</span><span class="lab">输出 Token</span></div>
      <div class="card stat-lg" id="t-cost-card"><span class="num" id="t-cost">¥0</span><span class="alert-badge" id="t-badge" style="display:none">⚠ 超阈值</span><span class="lab">估算总成本</span></div>
    </div>
    <div class="thresh-note" id="thresh-note"></div>
  </section>

  <section>
    <h2 class="sec-title">各会话用量</h2>
    <div class="card" style="padding:6px 6px">
      <table>
        <thead><tr>
          <th>会话 ID</th><th>通道</th><th>模型</th>
          <th class="num">输入</th><th class="num">输出</th><th class="num">总 Token</th>
          <th class="num">估算成本</th><th class="num">轮次</th><th>模式</th>
        </tr></thead>
        <tbody id="sess-body"></tbody>
      </table>
      <div id="sess-empty" class="empty" style="display:none">暂无活跃会话。先在控制台发起一次对话, 再回到本页查看用量。</div>
    </div>
  </section>

  <section>
    <h2 class="sec-title">价目参考 (元 / 千 token)</h2>
    <div class="card" style="padding:6px 6px">
      <table class="pricetbl">
        <thead><tr><th>模型</th><th>档位</th><th class="num">输入</th><th class="num">输出</th></tr></thead>
        <tbody id="price-body"></tbody>
      </table>
      <div class="hint">价格为估算量级 (接口多不返回 usage, 走字符数 × 系数), 仅用于成本认知, 非精确账单。</div>
    </div>
  </section>
</main>
<script>
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function fmtInt(n){n=n||0;return n.toLocaleString("en-US")}
function fmtCny(v){v=v||0;if(v===0)return "¥0";if(v<0.01)return "¥"+v.toFixed(5);if(v<1)return "¥"+v.toFixed(4);return "¥"+v.toFixed(2)}

async function load(){
  try{
    const r=await fetch("/api/cost");const d=await r.json();
    $("#meta-time").textContent="更新于 "+new Date().toLocaleTimeString("zh-CN");
    const t=d.total||{};
    $("#t-tok").textContent=fmtInt(t.est_total_tokens);
    $("#t-in").textContent=fmtInt(t.est_input_tokens);
    $("#t-out").textContent=fmtInt(t.est_output_tokens);
    $("#t-cost").textContent=fmtCny(t.est_cost_cny);
    const thr=(t.threshold!=null)?t.threshold:1.0;
    const over=!!t.over_threshold;
    $("#t-cost-card").classList.toggle("alert",over);
    $("#t-badge").style.display=over?"inline-block":"none";
    $("#thresh-note").textContent="成本预警阈值：¥"+Number(thr).toFixed(4)+(over?"　⚠ 进程总额已超阈值，请关注用量":"");
    const rows=(d.sessions||[]).map(s=>`<tr class="${s.over_threshold?'over':''}">
      <td style="font-family:monospace;font-size:12px">${esc(s.session_id)}</td>
      <td>${esc(s.backend)}</td>
      <td>${esc(s.model)}</td>
      <td class="num">${fmtInt(s.est_input_tokens)}</td>
      <td class="num">${fmtInt(s.est_output_tokens)}</td>
      <td class="num">${fmtInt(s.est_total_tokens)}</td>
      <td class="num">${fmtCny(s.est_cost_cny)}${s.over_threshold?' <span class="warn-ico">⚠</span>':''}</td>
      <td class="num">${fmtInt(s.turns)}</td>
      <td>${s.plan_mode?'<span class="mode-tag">计划</span>':'—'}</td>
    </tr>`).join("");
    $("#sess-body").innerHTML=rows||"";
    $("#sess-empty").style.display=(d.sessions&&d.sessions.length)?"none":"block";
    const pr=(d.pricing||[]).map(p=>`<tr>
      <td>${esc(p.model)}</td><td>${esc(p.label)}</td>
      <td class="num">¥${Number(p.in).toFixed(4)}</td>
      <td class="num">¥${Number(p.out).toFixed(4)}</td>
    </tr>`).join("");
    $("#price-body").innerHTML=pr||'<tr><td colspan="4" class="empty">无</td></tr>';
  }catch(e){$("#meta-time").textContent="加载失败: "+e}
}
let timer=null;
function start(){stop();load();if($("#auto").checked)timer=setInterval(load,5000)}
function stop(){if(timer)clearInterval(timer)}
$("#auto").addEventListener("change",start);
start();
</script>
  <script src="/static/subnav.js"></script>
</body>
</html>
