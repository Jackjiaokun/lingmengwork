<!DOCTYPE html>
<html data-lmw-nonav lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>自主进化 · 灵梦work</title>
<style>
  :root{
    --bg:#0b0e17; --panel:#141a2a; --panel2:#1b2236; --line:#262f47;
    --txt:#e6ecff; --sub:#8b97b8; --accent:#7c5cff; --accent2:#22d3ee;
    --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(160deg,#0b0e17,#0e1424 60%);color:var(--txt);
    font:14px/1.6 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px;}
  header{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  header h1{font-size:20px;margin:0;background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  header .tag{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:2px 9px;}
  .sub{color:var(--sub);font-size:12px;margin:2px 0 18px;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
  .kpi .v{font-size:26px;font-weight:700;}
  .kpi .l{font-size:12px;color:var(--sub);margin-top:2px;}
  .kpi.score .v{color:var(--accent2);}
  .bar{height:8px;border-radius:8px;background:var(--panel2);overflow:hidden;margin-top:8px;}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0 8px;}
  .row h2{font-size:15px;margin:0;}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:8px 14px;cursor:pointer;font-size:13px;}
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:linear-gradient(90deg,var(--accent),#9d7bff);border:none;color:#fff;}
  .sevbox{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .sev{padding:4px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);}
  .sev.high{color:var(--bad);border-color:#5a2b3a;}
  .sev.medium{color:var(--warn);border-color:#5a4a2b;}
  .sev.low{color:var(--ok);border-color:#2b5a45;}
  .empty{text-align:center;color:var(--sub);padding:40px;border:1px dashed var(--line);border-radius:14px;}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;
    border-left:4px solid var(--line);}
  .pcard.high{border-left-color:var(--bad);}
  .pcard.medium{border-left-color:var(--warn);}
  .pcard.low{border-left-color:var(--ok);}
  .pcard .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .pill{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--sub);}
  .pill.area{color:var(--accent2);border-color:#234;}
  .pill.sev.high{color:var(--bad);border-color:#5a2b3a;background:#2a1620;}
  .pill.sev.medium{color:var(--warn);border-color:#5a4a2b;background:#2a2416;}
  .pill.sev.low{color:var(--ok);border-color:#2b5a45;background:#16241d;}
  .pill.auto{color:var(--ok);border-color:#2b5a45;}
  .pcard .sym{font-weight:600;margin:4px 0;}
  .pcard .hyp{color:var(--sub);font-size:13px;margin:4px 0;}
  .pcard ul{margin:6px 0 0;padding-left:18px;}
  .pcard ul li{margin:2px 0;}
  .pcard .ref{font-size:11px;color:var(--sub);margin-top:8px;opacity:.7;}
  .plan{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px 12px;}
  .plan .pt{font-weight:600;color:var(--accent2);font-size:13px;margin-bottom:6px;}
  .plan ol{margin:4px 0 0;padding-left:20px;}
  .plan ol li{margin:3px 0;font-size:13px;}
  .plan .pv{font-size:12px;color:var(--ok);margin-top:6px;}
  .plan .pr{font-size:12px;color:var(--warn);margin-top:2px;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--accent);
    border-radius:10px;padding:12px 16px;font-size:13px;display:none;max-width:340px;}
  .pcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .pcard .acts .btn{padding:6px 12px;font-size:12px;}
  .repobox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;}
  .repobox h3{font-size:14px;margin:0 0 10px;}
  .repobox .empty{color:var(--sub);font-size:13px;padding:6px 0;}
  .patchrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;
    border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel2);}
  .patchrow .pid{font-weight:600;color:var(--accent2);font-size:13px;}
  .patchrow .meta{font-size:11px;color:var(--sub);margin-top:2px;}
  .patchrow .acts{display:flex;gap:6px;}
  .patchrow .acts .btn{padding:5px 10px;font-size:12px;}
  .patchdiff{background:#0a0d16;border:1px solid var(--line);border-radius:10px;padding:10px;
    font:12px/1.5 Consolas,Menlo,monospace;white-space:pre-wrap;color:#b9c4e6;
    max-height:280px;overflow:auto;margin-top:8px;display:none;}
  .modal{position:fixed;inset:0;background:rgba(4,7,14,.7);display:none;align-items:center;justify-content:center;z-index:50;}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:480px;width:90%;}
  .modal h3{margin:0 0 12px;font-size:16px;}
  .modal label{display:flex;gap:8px;align-items:center;font-size:13px;margin:12px 0;color:var(--sub);}
  .modal .mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;}
</style>
<link rel="stylesheet" href="/static/ds.css">
<script src="/static/sidebar.js"></script>
  <script src="/static/common.js"></script>
</head>
<body>
<div class="lmw-shell"><aside class="sidebar" id="lmw-sidebar"></aside><div class="lmw-content">
<div class="wrap">
  <header>
    <h1>🧬 自主进化闭环</h1>
    <span class="tag">Phase 18 · Self-Healing</span>
  </header>
  <div class="sub">采集离线自检失败 + 运行审计异常，自动生成结构化补丁提议（human-in-the-loop 待审，不直接改源码）。</div>

  <div class="kpis">
    <div class="kpi score"><div class="v" id="kHealth">--</div><div class="l">健康分</div>
      <div class="bar"><i id="kBar" style="width:0%"></i></div></div>
    <div class="kpi"><div class="v" id="kSignal">--</div><div class="l">信号量</div></div>
    <div class="kpi"><div class="v" id="kProp">--</div><div class="l">补丁提议</div></div>
    <div class="kpi"><div class="v" id="kAuto">--</div><div class="l">可自动修复</div></div>
  </div>

  <div class="row">
    <h2>严重度分布</h2>
    <div style="display:flex;gap:10px;">
      <button class="btn primary" id="btnExport">⬇ 导出待审提议</button>
      <button class="btn" id="btnExportMd">📄 导出可读报告</button>
    </div>
  </div>
  <div class="sevbox" id="sevBox">
    <span class="sev high">高 0</span><span class="sev medium">中 0</span><span class="sev low">低 0</span>
  </div>

  <div class="repobox">
    <h3>📦 补丁仓库 (Phase 20 · 人工合并门)</h3>
    <div id="patchRepo"><div class="empty">暂无已生成补丁。在下方提议卡点击「🛠 生成补丁」即可产出可应用 diff 候选。</div></div>
  </div>

  <div class="row"><h2>补丁提议清单</h2><span class="sub" id="genAt"></span></div>
  <div id="feed"><div class="empty">正在加载…</div></div>
</div>

<div class="modal" id="applyModal"><div class="box">
  <h3>⚙ 人工合并确认</h3>
  <div class="meta" id="applyMeta" style="font-size:12px;color:var(--sub);"></div>
  <label><input type="checkbox" id="applyConfirm" /> 我已复核补丁内容，确认落地（仍不自动改源码，仅记录确认状态与备份）</label>
  <div class="mbtns">
    <button class="btn" id="applyCancel">取消</button>
    <button class="btn primary" id="applyDo">确认合并</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const $ = LMW.$;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.style.display="block";
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.display="none",3600); }

function sevLabel(b){
  const h=b.high||0, m=b.medium||0, l=b.low||0;
  return `<span class="sev high">高 ${h}</span><span class="sev medium">中 ${m}</span><span class="sev low">低 ${l}</span>`;
}

function render(d){
  $("#kHealth").textContent = d.health_score;
  $("#kBar").style.width = d.health_score + "%";
  $("#kSignal").textContent = d.signal_count;
  $("#kProp").textContent = d.proposal_count;
  $("#kAuto").textContent = d.auto_fixable_count;
  $("#sevBox").innerHTML = sevLabel(d.by_severity||{});
  $("#genAt").textContent = d.generated_at ? ("生成于 " + d.generated_at) : "";

  const feed = $("#feed");
  if(!d.proposals || !d.proposals.length){
    feed.innerHTML = '<div class="empty">✅ 当前无异常信号，系统健康。自检与运行轨迹将持续被监控。</div>';
    return;
  }
  feed.innerHTML = d.proposals.map(p=>{
    const acts = (p.actions||[]).map(a=>`<li>${escapeHtml(a)}</li>`).join("");
    const auto = p.auto_fixable ? '<span class="pill auto">可自动修复</span>' : '<span class="pill">需人工复核</span>';
    let plan = "";
    const pl = p.patch_plan || {};
    if(pl.title || (pl.steps&&pl.steps.length)){
      const steps = (pl.steps||[]).map(s=>`<li>${escapeHtml(s)}</li>`).join("");
      const verify = pl.verify ? `<div class="pv">✓ 验证：${escapeHtml(pl.verify)}</div>` : "";
      const risk = pl.risk ? `<div class="pr">⚠ 风险：${escapeHtml(pl.risk)}</div>` : "";
      plan = `<div class="plan">
        <div class="pt">🛠 可执行补丁预案：${escapeHtml(pl.title||"")}</div>
        ${steps ? `<ol>${steps}</ol>` : ""}
        ${verify}${risk}
      </div>`;
    }
    return `<div class="pcard ${p.severity}">
      <div class="ph">
        <span class="pill sev ${p.severity}">${p.severity.toUpperCase()}</span>
        <span class="pill area">${escapeHtml(p.area)}</span>
        <span class="pill">置信度 ${(p.confidence*100).toFixed(0)}%</span>
        ${auto}
      </div>
      <div class="sym">${escapeHtml(p.symptom)}</div>
      <div class="hyp">假设：${escapeHtml(p.hypothesis)}</div>
      <ul>${acts}</ul>
      ${plan}
      <div class="acts">
        <button class="btn" data-act="gen" data-pid="${escapeHtml(p.id||"")}">🛠 生成补丁</button>
        <button class="btn" data-act="apply" data-pid="${escapeHtml(p.id||"")}">⚙ 人工合并</button>
      </div>
      <div class="ref">来源：${escapeHtml(p.source_ref||"")} · 规则 ${escapeHtml(p.rule_id||"")}</div>
    </div>`;
  }).join("");
}

function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function poll(){
  try{
    const r = await fetch("/api/heal");
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d = await r.json();
    render(d);
  }catch(e){ /* 静默 */ }
}

$("#btnExport").addEventListener("click", async ()=>{
  try{
    const r = await fetch("/api/heal/export",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
    const d = await r.json();
    if(d.ok) toast("已导出 " + d.count + " 条提议到 " + d.path);
    else toast("导出失败: " + (d.error||"未知"));
  }catch(e){ toast("导出请求失败: " + e.message); }
});

$("#btnExportMd").addEventListener("click", async ()=>{
  try{
    const r = await fetch("/api/heal/export-md",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
    const d = await r.json();
    if(d.ok) toast("已生成可读报告: " + d.md_path);
    else toast("导出失败: " + (d.error||"未知"));
  }catch(e){ toast("导出请求失败: " + e.message); }
});

// ---- Phase 20 自愈闭环 2.0 前端逻辑 ----
async function generatePatch(pid){
  try{
    const r = await fetch("/api/heal/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({proposal_id:pid})});
    const d = await r.json();
    if(d.ok) toast("已生成补丁 "+d.patch_id+" ("+d.generated_by+")");
    else toast("生成失败: "+(d.error||"未知"));
    renderPatches();
  }catch(e){ toast("请求失败: "+e.message); }
}
async function verifyPatch(patchId){
  try{
    const r = await fetch("/api/heal/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({patch_id:patchId})});
    const d = await r.json();
    if(d.ok) toast("沙箱验证:\n"+d.log);
    else toast("验证失败: "+(d.error||"未知"));
  }catch(e){ toast("请求失败: "+e.message); }
}
async function applyPatch(patchId, confirm){
  try{
    const r = await fetch("/api/heal/apply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({patch_id:patchId, confirm:confirm})});
    const d = await r.json();
    toast(d.note || (d.ok?"已处理":"失败:"+(d.error||"")));
  }catch(e){ toast("请求失败: "+e.message); }
}
function toggleDiff(patchId){
  const el = document.getElementById("diff_"+patchId);
  if(el) el.style.display = el.style.display==="block" ? "none" : "block";
}
async function renderPatches(){
  try{
    const r = await fetch("/api/heal/patches");
    const d = await r.json();
    const box = $("#patchRepo");
    const list = (d.patches||[]);
    if(!list.length){ box.innerHTML = '<div class="empty">暂无已生成补丁。在下方提议卡点击「🛠 生成补丁」即可产出可应用 diff 候选。</div>'; return; }
    box.innerHTML = list.map(m=>{
      const diff = escapeHtml(m.diff||"");
      const meta = (m.generated_by||"rule") + (m.target? (" · "+escapeHtml(m.target)) : " · 需人工指定目标");
      return `<div class="patchrow">
        <div>
          <div class="pid">${escapeHtml(m.patch_id)}</div>
          <div class="meta">${meta}</div>
        </div>
        <div class="acts">
          <button class="btn" onclick="toggleDiff('${escapeHtml(m.patch_id)}')">📋 diff</button>
          <button class="btn" onclick="verifyPatch('${escapeHtml(m.patch_id)}')">✓ 验证</button>
          <button class="btn primary" onclick="openApply('${escapeHtml(m.patch_id)}')">⚙ 合并</button>
        </div>
        <div class="patchdiff" id="diff_${escapeHtml(m.patch_id)}">${diff}</div>
      </div>`;
    }).join("");
  }catch(e){ /* 静默 */ }
}
$("#feed").addEventListener("click", (e)=>{
  const btn = e.target.closest("button[data-act]");
  if(!btn) return;
  const pid = btn.getAttribute("data-pid");
  const act = btn.getAttribute("data-act");
  if(act==="gen") generatePatch(pid);
  else if(act==="apply") openApply(pid);
});
let _applyPid = null;
function openApply(patchId){ _applyPid = patchId; $("#applyMeta").textContent = "补丁: " + patchId; $("#applyConfirm").checked = false; $("#applyModal").style.display = "flex"; }
$("#applyCancel").addEventListener("click", ()=>{ $("#applyModal").style.display="none"; });
$("#applyDo").addEventListener("click", async ()=>{
  if(!$("#applyConfirm").checked){ toast("请先勾选确认框"); return; }
  $("#applyModal").style.display="none";
  await applyPatch(_applyPid, true);
});

poll();
setInterval(poll, 4000);
renderPatches();
setInterval(renderPatches, 8000);
</script>
  <script src="/static/nav.js"></script>
  <script src="/static/theme.js"></script>
</div></div>
  <script src="/static/commands.js"></script>
</body>
</html>
