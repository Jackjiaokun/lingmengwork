<!DOCTYPE html>
<html data-lmw-nonav lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵梦work · 记忆中枢</title>
<style>
  :root{
    --bg:#070a14; --card:rgba(20,27,48,.62); --card2:#1a2238;
    --line:rgba(126,146,210,.16); --txt:#e9edf8; --mut:#828caa; --acc:#7c5cff;
    --ok:#34e0a1; --warn:#ffb454; --fail:#ff5c7c; --brand2:#4dd0e1;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--txt);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:rgba(14,20,36,.7);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header h1{font-size:17px;margin:0;font-weight:600}
  header h1 .ac{color:var(--acc)}
  .head-sp{flex:1}
  a.btn{background:linear-gradient(135deg,#7c5cff,#5b8bff);border:1px solid transparent;color:#fff;padding:7px 14px;border-radius:9px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block;box-shadow:0 6px 20px rgba(124,92,255,.3)}
  a.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);box-shadow:none}
  a.btn.ghost:hover{border-color:var(--acc)}
  main{max-width:1000px;margin:0 auto;padding:18px 22px 60px}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
  .sec h2{font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .sec h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
  textarea{width:100%;background:#0a0f1d;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;resize:vertical;min-height:200px}
  input[type=text]{background:#0a0f1d;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 11px;font-size:13px;font-family:inherit;width:100%}
  .row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:10px}
  .row.title{flex:0 0 260px}
  .acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
  .btn.sm{padding:6px 14px;font-size:12.5px}
  .btn.green{background:linear-gradient(135deg,#34e0a1,#2bbf88);box-shadow:0 6px 20px rgba(52,224,161,.25)}
  .loglist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .logchip{background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12.5px}
  .logchip:hover{border-color:var(--acc)}
  .logchip.active{border-color:var(--acc);background:rgba(124,92,255,.14);color:var(--acc)}
  .hint{color:var(--mut);font-size:12px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(20,27,48,.96);border:1px solid var(--line);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none}
  .toast.show{opacity:1}
</style>
<link rel="stylesheet" href="/static/ds.css">
<script src="/static/sidebar.js"></script>
  <script src="/static/common.js"></script>
</head>
<body>
<div class="lmw-shell"><aside class="sidebar" id="lmw-sidebar"></aside><div class="lmw-content">
  <header>
    <a class="btn ghost" href="/">← 返回面板</a>
    <h1>🧠 记忆<span class="ac">中枢</span></h1>
    <div class="head-sp"></div>
    <span class="hint">长期记忆 · 每日日志 · 跨会话留存</span>
  </header>
  <main>
    <section class="sec">
      <h2><span class="dot"></span>长期项目记忆 (MEMORY.md)</h2>
      <textarea id="mem" placeholder="项目约定 / 架构要点 / 开放问题 ..."></textarea>
      <div class="acts">
        <button class="btn sm" id="saveMem">💾 整体保存</button>
        <button class="btn sm ghost" id="reloadMem">↻ 重新载入</button>
      </div>
    </section>

    <section class="sec">
      <h2><span class="dot"></span>追加一条记忆笔记</h2>
      <div class="row title"><input type="text" id="noteTitle" placeholder="标题(可选), 如: 部署约定" /></div>
      <textarea id="noteBody" style="min-height:90px" placeholder="要记入长期记忆的内容 ..."></textarea>
      <div class="acts"><button class="btn sm green" id="appendMem">➕ 追加到记忆</button></div>
    </section>

    <section class="sec">
      <h2><span class="dot"></span>每日工作日志</h2>
      <div class="loglist" id="logList"></div>
      <div class="row title"><input type="text" id="logTitle" placeholder="小节标题(可选), 如: 完成升级" /></div>
      <textarea id="logBody" style="min-height:90px" placeholder="今天做了什么 / 关键决策 ..."></textarea>
      <div class="acts"><button class="btn sm green" id="appendLog">📝 写入今日日志</button></div>
      <div id="logView" style="margin-top:12px"></div>
    </section>

    <section class="sec">
      <h2><span class="dot"></span>语义记忆 · 智能抽取与召回</h2>
      <p class="hint" style="margin-top:0">从一段文本中由 LLM 抽取「约定/决策/偏好/事实/风险」并写入长期记忆(无 key 时走规则兜底, 自动去重)。</p>
      <textarea id="capText" style="min-height:90px" placeholder="粘贴一段对话/笔记, 点击抽取将自动提炼关键记忆 ..."></textarea>
      <div class="acts"><button class="btn sm green" id="capBtn">🧠 智能抽取并记忆</button><span class="hint" id="capHint"></span></div>
      <div style="height:14px"></div>
      <div class="row" style="margin-bottom:8px">
        <input type="text" id="retrieQ" placeholder="输入查询, 如: 部署约定 / 商汤 key" style="flex:1;min-width:240px" />
        <button class="btn sm" id="retrieBtn">🔎 语义召回</button>
      </div>
      <div id="retrieRes"></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>

<script>
const $ = LMW.$;
function toast(m, ok){ return LMW.toast(m, ok); }
async function api(url, opt){ const r=await fetch(url,opt); const d=await r.json().catch(()=>({error:"解析失败"})); if(d.error) throw new Error(d.error); return d; }

async function loadMemory(){
  try{ const d=await api("/api/memory"); $("#mem").value=d.memory||"";
    const ll=$("#logList"); ll.innerHTML="";
    (d.logs||[]).forEach(l=>{ const b=document.createElement("button"); b.className="logchip"; b.textContent=l.date; b.onclick=()=>viewLog(l.date,b); ll.appendChild(b); });
  }catch(e){ toast(e.message,false); }
}
async function viewLog(date, el){
  document.querySelectorAll(".logchip").forEach(c=>c.classList.remove("active")); el.classList.add("active");
  try{ const d=await api("/api/memory?log="+encodeURIComponent(date));
    $("#logView").innerHTML="<div style='margin-top:10px;color:var(--mut);font-size:12px'>📄 "+date+" 日志</div><pre style='white-space:pre-wrap;background:#0a0f1d;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:12.5px;max-height:280px;overflow:auto'>"+((d.content||"(空)").replace(/</g,"&lt;"))+"</pre>";
  }catch(e){ toast(e.message,false); }
}
$("#saveMem").onclick=async()=>{ try{ await api("/api/memory",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"replace",content:$("#mem").value})}); toast("已保存 MEMORY.md"); }catch(e){ toast(e.message,false); } };
$("#reloadMem").onclick=()=>loadMemory();
$("#appendMem").onclick=async()=>{ const t=$("#noteBody").value.trim(); if(!t){toast("请填写内容",false);return;} try{ await api("/api/memory",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"append",title:$("#noteTitle").value.trim(),content:t})}); toast("已追加到记忆"); $("#noteBody").value=""; $("#noteTitle").value=""; loadMemory(); }catch(e){ toast(e.message,false); } };
$("#appendLog").onclick=async()=>{ const t=$("#logBody").value.trim(); if(!t){toast("请填写内容",false);return;} try{ await api("/api/memory",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"log",title:$("#logTitle").value.trim(),content:t})}); toast("已写入今日日志"); $("#logBody").value=""; $("#logTitle").value=""; loadMemory(); }catch(e){ toast(e.message,false); } };

// ---- 语义记忆: 智能抽取 + 召回 ----
$("#capBtn").onclick=async()=>{ const t=$("#capText").value.trim(); if(!t){toast("请粘贴待抽取文本",false);return;} $("#capHint").textContent="抽取中…"; try{ const d=await api("/api/memory",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"capture",content:t})}); const n=(d.captured||[]).length; $("#capHint").textContent="已抽取 "+n+" 条"+(n?("; 累计 "+d.total+" 条"):""); toast(n?("已抽取 "+n+" 条关键记忆"):"未识别到可记忆信息"); $("#capText").value=""; loadMemory(); }catch(e){ $("#capHint").textContent=""; toast(e.message,false); } };
$("#retrieBtn").onclick=async()=>{ const q=$("#retrieQ").value.trim(); if(!q){toast("请输入查询",false);return;} try{ const d=await api("/api/memory/retrieve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q,k:6})}); const rr=d.results||[]; const box=$("#retrieRes"); if(!rr.length){ box.innerHTML='<p class="hint" style="margin:6px 0">未召回相关记忆。</p>'; return; } box.innerHTML='<div style="margin:8px 0 4px;color:var(--mut);font-size:12px">召回 '+rr.length+' 条 (按相关度排序):</div>'+ rr.map(r=>'<div style="background:#0a0f1d;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0"><div style="font-size:11px;color:var(--acc);margin-bottom:4px">📎 '+(r.source||"")+' · 相关度 '+(r.score||0)+'</div><div style="font-size:12.5px;white-space:pre-wrap;word-break:break-word">'+((r.snippet||"").replace(/</g,"&lt;"))+'</div></div>').join(""); }catch(e){ toast(e.message,false); } };
loadMemory();
</script>
  <script src="/static/nav.js"></script>
  <script src="/static/theme.js"></script>
</div></div>
  <script src="/static/commands.js"></script>
</body>
</html>
