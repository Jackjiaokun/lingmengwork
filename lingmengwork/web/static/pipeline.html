<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>目标流水线 · 灵梦work</title>
<style>
  :root{
    --bg:#0b0f1a; --panel:rgba(255,255,255,.04); --panel-2:rgba(255,255,255,.06);
    --stroke:rgba(255,255,255,.10); --txt:#e6e9f2; --muted:#9aa3b8;
    --brand:#8b5cf6; --brand-2:#22d3ee; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(1100px 600px at 12% -8%, rgba(139,92,246,.18), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(34,211,238,.14), transparent 55%),
      var(--bg);
    color:var(--txt);font:14px/1.6 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 70px}
  header h1{margin:0 0 4px;font-size:23px;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{margin:0 0 16px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--stroke);border-radius:16px;padding:16px 18px;margin-bottom:16px}
  label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.6px}
  textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--stroke);border-radius:10px;color:var(--txt);
    padding:10px 12px;font:inherit;resize:vertical;outline:none;min-height:80px}
  textarea:focus{border-color:var(--brand)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  select{background:rgba(0,0,0,.25);border:1px solid var(--stroke);border-radius:10px;color:var(--txt);padding:8px 10px;font:inherit}
  button{cursor:pointer;border:1px solid var(--stroke);background:var(--panel-2);color:var(--txt);padding:9px 15px;border-radius:10px;font:inherit;transition:.16s}
  button:hover{background:rgba(255,255,255,.12)}
  button.primary{background:linear-gradient(90deg,var(--brand),var(--brand-2));border:none;color:#06121f;font-weight:700}
  button:disabled{opacity:.5;cursor:not-allowed}
  .status{color:var(--muted);font-size:12px;margin-top:8px;min-height:16px}
  .flow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .chip{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--stroke);color:var(--muted)}
  .chip.on{background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#06121f;font-weight:700;border:none}
  .stage{border:1px solid var(--stroke);border-radius:14px;padding:14px 16px;margin-bottom:14px;background:var(--panel-2)}
  .stage h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
  .stage h3 .n{width:22px;height:22px;border-radius:999px;background:rgba(139,92,246,.25);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .tag{font-size:11px;color:var(--muted)}
  .badge{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--stroke)}
  .badge.dom{color:#06121f;font-weight:700;border:none}
  .dep{color:var(--muted);font-size:12px;margin-left:8px}
  .step-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
  .step-row:last-child{border-bottom:none}
  .exec{border:1px solid var(--stroke);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--panel)}
  .exec .top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .exec .t{font-weight:700;color:#fff}
  .art-badge{font-size:12px;padding:2px 9px;border-radius:999px}
  .art-badge.real{color:#bbf7d0;background:rgba(16,185,129,.14)}
  .art-badge.fake{color:#fde68a;background:rgba(245,158,11,.14)}
  .art-prev{margin-top:10px;border:1px solid var(--stroke);border-radius:10px;padding:10px;background:rgba(0,0,0,.22);
    display:flex;flex-direction:column;align-items:center;gap:8px}
  .art-prev img{max-width:100%;border-radius:6px}
  .art-prev audio{width:100%}
  .art-prev .note{font-size:12px;color:var(--muted)}
  .art-prev .dl{color:#fff;font-size:12px;text-decoration:none;padding:6px 14px;border-radius:8px;background:rgba(139,92,246,.3);border:1px solid var(--stroke)}
  .art-prev .dl:hover{background:rgba(139,92,246,.5)}
  .au-card{margin-top:10px;border:1px solid rgba(16,185,129,.35);border-radius:10px;padding:10px;background:rgba(16,185,129,.06)}
  .au-card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .au-files{margin-top:6px;font-size:13px;color:var(--muted)}
  .au-files code{background:rgba(0,0,0,.35);padding:2px 7px;border-radius:6px;margin:0 3px;color:#cbd5e1;font-size:12px}
  .au-files .dl{display:inline-block;margin-left:6px;color:#fff;font-size:12px;text-decoration:none;padding:3px 10px;border-radius:7px;background:rgba(16,185,129,.3);border:1px solid var(--stroke)}
  .au-warn{margin-top:6px;font-size:12px;color:#fde68a}
  .md{margin-top:4px}
  .md-h{margin:12px 0 5px;color:#fff;border-left:3px solid var(--brand);padding-left:10px;font-size:14px}
  .md-h2{margin:10px 0 4px;color:#fff;font-size:13.5px;font-weight:700}
  .md-p{margin:5px 0}
  .md-li{margin:3px 0 3px 18px;list-style:none;position:relative}
  .md-li::before{content:"▸";position:absolute;left:-16px;color:var(--brand-2)}
  .md-code{background:rgba(0,0,0,.4);border:1px solid var(--stroke);border-radius:10px;padding:12px;overflow:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
  .md-ic{background:rgba(139,92,246,.18);border-radius:5px;padding:1px 5px;font-family:ui-monospace,monospace;font-size:12.5px}
  .md-q{margin:6px 0;padding:6px 12px;border-left:3px solid var(--brand-2);background:rgba(34,211,238,.08);color:var(--muted);border-radius:0 8px 8px 0}
  .md-sp{height:6px}
  .score{font-size:30px;font-weight:800}
  .score.good{color:var(--ok)} .score.mid{color:var(--warn)} .score.low{color:var(--bad)}
  .delivery{background:rgba(0,0,0,.22);border:1px solid var(--stroke);border-radius:12px;padding:14px 16px;max-height:520px;overflow:auto}
  .actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .hidden{display:none}
  .mem{border:1px solid var(--stroke);border-radius:10px;padding:10px 12px;background:rgba(34,211,238,.06);margin-top:10px}
  .mem h4{margin:0 0 6px;font-size:12px;color:var(--brand-2);letter-spacing:.5px}
  .mem .item{font-size:12.5px;color:var(--muted);padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
  .mem .item:last-child{border-bottom:none}
  .mem .src{color:var(--brand-2);font-size:11px}
  .learn-badge{font-size:11px;color:#bbf7d0;background:rgba(16,185,129,.14);padding:2px 9px;border-radius:999px;margin-left:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>目标驱动流水线</h1>
    <p>一个模糊目标 → 理解 → 拆解 → 编排 → 执行 → 自检 → 交付。编程/音频/图片/视频 四域自由调度。</p>
  </header>

  <div class="card">
    <label>模糊目标</label>
    <textarea id="goal" placeholder="例如：做一个面向金融科技的自媒体短视频账号，从选题到成片全自动"></textarea>
    <label style="margin-top:12px">补充上下文（可选）</label>
    <textarea id="ctx" placeholder="如：目标平台抖音/B站，风格科技感，已有品牌主色蓝紫"></textarea>
    <div class="row">
      <label style="margin:0">执行蓝图步数上限</label>
      <select id="md">
        <option value="3">3 步（极快）</option>
        <option value="4" selected>4 步（标准）</option>
        <option value="6">6 步（深入）</option>
      </select>
      <button class="primary" id="run">🚀 运行全链路</button>
      <button id="recallBtn">🧠 预览记忆喂入</button>
    </div>
    <div class="status" id="status"></div>
    <div class="mem hidden" id="memPrev"></div>
  </div>

  <div class="flow hidden" id="flow"></div>
  <div id="out" class="hidden"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function inlineMd(t){
  let s = esc(t);
  s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  s = s.replace(/`([^`]+?)`/g, '<code class="md-ic">$1</code>');
  return s;
}
function renderMd(src){
  const lines = String(src||"").split(/\r?\n/);
  let html="", inCode=false, buf=[];
  const flush=()=>{ if(buf.length){ html+='<pre class="md-code"><code>'+esc(buf.join("\n"))+'</code></pre>'; buf=[]; } };
  for(const line of lines){
    if(/^\s*```/.test(line)){ if(inCode){flush();inCode=false;}else{inCode=true;} continue; }
    if(inCode){ buf.push(line); continue; }
    let m;
    if(/^\s*&gt;/.test(line)){ html+='<div class="md-q">'+inlineMd(line.replace(/^\s*&gt;\s?/,""))+'</div>'; continue; }
    if((m=line.match(/^(#{2,4})\s+(.*)$/))){ const l=m[1].length; html+='<h'+l+' class="md-h'+(l>2?'2':'')+'">'+inlineMd(m[2])+'</h'+l+'>'; continue; }
    if(/^\d+[.、]\s+/.test(line)){ html+='<div class="md-li">'+inlineMd(line.replace(/^\d+[.、]\s+/,""))+'</div>'; continue; }
    if(/^[-*]\s+/.test(line)){ html+='<div class="md-li">'+inlineMd(line.replace(/^[-*]\s+/,""))+'</div>'; continue; }
    if(line.trim()===""){ html+='<div class="md-sp"></div>'; continue; }
    html+='<p class="md-p">'+inlineMd(line)+'</p>';
  }
  if(inCode) flush();
  return html;
}
const STAGES = ["理解","拆解","编排","执行","自检","交付"];
function renderFlow(active){
  const f = $("#flow"); f.className="flow"; f.innerHTML="";
  STAGES.forEach((s,i)=>{
    const c = document.createElement("span");
    c.className = "chip" + (i<=active ? " on" : "");
    c.textContent = (i+1)+"·"+s;
    f.appendChild(c);
  });
}

async function run(){
  const goal = $("#goal").value.trim();
  if(!goal){ $("#status").textContent="请填写模糊目标"; return; }
  const ctx = $("#ctx").value.trim();
  const md = parseInt($("#md").value,10)||4;
  const btn = $("#run"); btn.disabled=true;
  renderFlow(0);
  $("#out").className="hidden";
  $("#status").textContent = "全链路运行中（理解 → 拆解 → 编排 → 执行 → 自检 → 交付）…";
  try{
    const r = await fetch("/api/pipeline",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ goal, context: ctx, max_dispatch: md })
    });
    const j = await r.json();
    if(j.error){ $("#status").textContent="失败: "+j.error; return; }
    renderAll(j);
    $("#status").textContent = "✅ 全链路完成，耗时 "+ (j.elapsed_sec||"?") +"s · 自检评分 "+ (j.selfcheck?.score??"?") +"/100";
  }catch(e){ $("#status").textContent="请求异常: "+e.message; }
  finally{ btn.disabled=false; }
}

function renderAll(j){
  renderFlow(STAGES.length-1);
  const out = $("#out"); out.className=""; out.innerHTML="";
  // 理解 (+ Phase 9 跨会话记忆喂入可视化)
  const mem = j.understand.memory||[];
  let memHtml = "";
  if(j.understand.memory_recalled){
    memHtml = '<div class="mem"><h4>🧠 已喂入 '+j.understand.memory_recalled+' 条跨会话记忆（历史偏好 / 决策一致性）</h4>';
    mem.forEach(m=>{ memHtml += '<div class="item"><span class="src">'+esc(m.source||"")+' · '+esc(m.score??"")+'</span><br>'+esc(m.snippet||"")+'</div>'; });
    memHtml += '</div>';
  }
  const learnBadge = (j.learned && (j.learned.captured||[]).length)
    ? ' <span class="learn-badge">✅ 已写回记忆 '+j.learned.captured.length+' 条</span>' : '';
  let h = '<div class="stage"><h3><span class="n">1</span>理解'+learnBadge+'</h3>'
        + '<div class="md"><p class="md-p">'+inlineMd(j.understand.goal)+'</p>'
        + (j.understand.context ? '<p class="md-p tag">补充上下文：'+inlineMd(j.understand.context)+'</p>' : '')
        + '<p class="tag">捕获于 '+esc(j.understand.captured_at)+'</p>'
        + memHtml + '</div></div>';
  // 拆解
  h += '<div class="stage"><h3><span class="n">2</span>拆解 · '+ (j.decompose.count) +' 步</h3>';
  (j.decompose.steps||[]).forEach(s=>{
    const meta = {code:"🟣编程",audio:"🟢音频",image:"🌸图片",video:"🔵视频",any:"🔷通用"}[s.domain]||s.domain;
    const dep = s.depends&&s.depends.length ? '<span class="dep">← 依赖 '+esc(s.depends.join(","))+'</span>' : '';
    h += '<div class="step-row"><span class="badge dom" style="background:'+ (s.domain==='code'?'#8b5cf6':s.domain==='audio'?'#10b981':s.domain==='image'?'#f472b6':s.domain==='video'?'#6366f1':'#22d3ee') +'">'+meta+'</span>'
       + '<span>'+esc(s.title)+'</span>'+dep+'</div>';
  });
  h += '</div>';
  // 编排
  const oc = (j.orchestrate.domain_coverage||[]).map(d=>({code:"编程",audio:"音频",image:"图片",video:"视频"}[d]||d)).join("、")||"通用/编程";
  h += '<div class="stage"><h3><span class="n">3</span>编排</h3>'
     + '<div class="md"><p class="md-p">覆盖域：<b>'+esc(oc)+'</b></p>'
     + '<p class="md-p tag">并行批次（同层可并行）：'+esc(JSON.stringify(j.orchestrate.parallel_groups||[]))+'</p>'
     + '<p class="md-p tag">执行序：'+esc((j.orchestrate.execution_order||[]).join(" → "))+'</p></div></div>';
  // 执行
  h += '<div class="stage"><h3><span class="n">4</span>执行 · 各域创作蓝图</h3>';
  const renderArtifactTag = (art)=> art ? '<span class="art-badge '+(art.real?'real':'fake')+'">'+(art.real?'✅ 真实媒体':'⚠️ 降级占位')+'</span>' : '';
  const renderArtifact = (art)=>{
    if(!art || !art.url) return '';
    const isAudio = (art.mime||'').startsWith('audio');
    const media = isAudio ? '<audio controls src="'+esc(art.url)+'"></audio>' : '<img src="'+esc(art.url)+'" alt="preview" />';
    return '<div class="art-prev">'+media
      + (art.note ? '<div class="note">'+esc(art.note)+'</div>' : '')
      + '<a class="dl" href="'+esc(art.url)+'" target="_blank">⬇ 下载</a></div>';
  };
  const renderAutonomous = (ex)=>{
    const au = ex.autonomous; if(!au || !au.files || !au.files.length) return '';
    const rv = au.review||{};
    const badge = au.reached ? '<span class="art-badge real">✅ 自主达成</span>' : '<span class="art-badge fake">🔄 未达成</span>';
    let s = '<div class="au-card"><div class="top">🤖 自主回路 '+badge
          + '<span class="tag">'+au.iterations+' 轮 · 编译校验 '+rv.passed+'/'+rv.checked+' 通过</span></div>'
          + '<div class="au-files"><b>生成文件：</b>'
          + au.files.map(f=>'<code>'+esc(f)+'</code>').join(' ')
          + (rv.dir ? ' · <a class="dl" href="'+esc(rv.dir)+'" target="_blank">⬇ 目录</a>' : '') + '</div>';
    const fails = (rv.details||[]).filter(d=>!d.ok);
    if(fails.length){ s += '<div class="au-warn">⚠️ '+fails.length+' 个文件编译未通过（需人工复核）</div>'; }
    s += '</div>';
    return s;
  };
  (j.execute||[]).forEach(ex=>{
    h += '<div class="exec"><div class="top"><span class="badge dom" style="background:'+esc(ex.theme)+'">'+esc(ex.emoji)+' '+esc(ex.domain_name)+'</span>'
       + '<span class="t">'+esc(ex.title)+'</span>'
       + renderArtifactTag(ex.artifact) + '</div>'
       + renderAutonomous(ex)
       + '<div class="md">'+renderMd(ex.plan)+'</div>'
       + renderArtifact(ex.artifact) + '</div>';
  });
  h += '</div>';
  // 自检
  const sc = j.selfcheck||{}; const sv = sc.score??0;
  const cls = sv>=80?'good':sv>=60?'mid':'low';
  h += '<div class="stage"><h3><span class="n">5</span>自检</h3>'
     + '<div class="md"><span class="score '+cls+'">'+sv+'</span><span class="tag"> /100 · 模式 '+esc(sc.mode||"?")+'</span>'
     + (sc.gaps&&sc.gaps.length ? '<p class="md-p">待补强：'+esc(sc.gaps.join("；"))+'</p>' : '')
     + (sc.notes&&sc.notes.length ? '<p class="md-p tag">建议：'+esc(sc.notes.join("；"))+'</p>' : '') + '</div></div>';
  // 交付
  h += '<div class="stage"><h3><span class="n">6</span>交付</h3>'
     + '<div class="delivery md">'+renderMd(j.delivery)+'</div>'
     + '<div class="actions"><button id="savePlan" class="primary">📥 存入计划书</button>'
     + '<button id="copyDel">📋 复制交付稿</button><span class="status" id="planMsg"></span></div></div>';
  out.innerHTML = h;

  $("#savePlan").onclick = async () => {
    const pp = j.plan_payload||{};
    const r = await fetch("/api/plans",{method:"POST",headers:{"Content-Type":"application/json"},
      body: JSON.stringify({title:pp.title, content:pp.content, tasks:pp.tasks})});
    const pj = await r.json().catch(()=>({error:"保存失败"}));
    $("#planMsg").textContent = pj.ok ? "✅ 已存入计划书" : ("❌ "+(pj.error||"保存失败"));
  };
  $("#copyDel").onclick = () => {
    navigator.clipboard?.writeText(j.delivery||"").then(()=>{ $("#planMsg").textContent="✅ 交付稿已复制"; });
  };
}
$("#recallBtn").onclick = async () => {
  const goal = $("#goal").value.trim();
  if(!goal){ $("#status").textContent="请先填写目标再预览记忆"; return; }
  const box = $("#memPrev"); box.className="mem";
  box.innerHTML = "<h4>🧠 记忆召回中…</h4>";
  try{
    const r = await fetch("/api/pipeline/recall",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ goal, k: 6 })
    });
    const j = await r.json().catch(()=>({}));
    if(!j.ok){ box.innerHTML="<h4>记忆预览</h4><div class='item'>暂无相关记忆或召回失败</div>"; return; }
    let hh = "<h4>🧠 将喂入流水线的跨会话记忆（"+j.count+" 条）</h4>";
    if(!j.count){ hh += "<div class='item'>（暂无相关记忆，将仅基于当前目标运行）</div>"; }
    (j.memory||[]).forEach(m=>{ hh += "<div class='item'><span class='src'>"+esc(m.source||"")+" · "+esc(m.score??"")+"</span><br>"+esc(m.snippet||"")+"</div>"; });
    box.innerHTML = hh;
  }catch(e){ box.innerHTML = "<h4>记忆预览</h4><div class='item'>异常: "+esc(e.message)+"</div>"; }
};
$("#run").onclick = run;
</script>
</body>
</html>
