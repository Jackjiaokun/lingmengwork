<!DOCTYPE html>
<html data-lmw-nonav lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵梦work · 密钥保险箱</title>
<style>
  :root{
    --bg:#070a14; --bg2:#0e1424; --card:rgba(20,27,48,.62); --card2:#1a2238;
    --line:rgba(126,146,210,.16); --txt:#e9edf8; --mut:#828caa; --acc:#7c5cff;
    --ok:#34e0a1; --warn:#ffb454; --fail:#ff5c7c; --brand2:#4dd0e1;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.5;
    background:
      radial-gradient(1100px 700px at 10% -10%, rgba(124,92,255,.14), transparent 60%),
      radial-gradient(900px 700px at 100% 0%, rgba(77,208,225,.10), transparent 55%),
      var(--bg);
    background-attachment:fixed}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;
    background:rgba(14,20,36,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);position:relative}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(124,92,255,.6),transparent)}
  header h1{font-size:17px;margin:0;font-weight:600}
  header h1 .ac{color:var(--acc)}
  .head-sp{flex:1}
  a.btn{background:linear-gradient(135deg,#7c5cff,#5b8bff);border:1px solid transparent;color:#fff;
    padding:7px 14px;border-radius:9px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block;
    box-shadow:0 6px 20px rgba(124,92,255,.3);transition:transform .14s ease,filter .2s ease}
  a.btn:hover{transform:translateY(-1px);filter:brightness(1.08);border-color:transparent}
  a.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);box-shadow:none}
  a.btn.ghost:hover{border-color:var(--acc);filter:none}
  main{max-width:1000px;margin:0 auto;padding:18px 22px 60px}
  .bar .hint{color:var(--mut);font-size:12px;display:block;margin-bottom:14px;line-height:1.6}
  .warnbox{background:rgba(255,180,84,.1);border:1px solid rgba(255,180,84,.3);color:var(--warn);
    padding:9px 13px;border-radius:9px;font-size:12px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
    display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}
  .sec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--acc),var(--brand2))}
  .sec .nm{font-weight:600;font-size:14px;font-family:monospace}
  .sec .note{color:var(--mut);font-size:12px}
  .sec .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
  .sec .acts button{background:var(--card2);border:1px solid var(--line);color:var(--txt);
    padding:5px 10px;border-radius:8px;cursor:pointer;font-size:12px}
  .sec .acts button:hover{border-color:var(--acc)}
  .sec .acts button.danger:hover{border-color:var(--fail);color:var(--fail)}
  .empty{color:var(--mut);text-align:center;padding:40px;border:1px dashed var(--line);border-radius:12px}
  .modal{position:fixed;inset:0;background:rgba(4,7,15,.66);display:flex;align-items:center;
    justify-content:center;padding:20px;z-index:60}
  .modal[hidden]{display:none!important}
  .mbox{width:520px;max-width:100%;background:var(--bg2);border:1px solid var(--line);
    border-radius:14px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .mbox h3{margin:0 0 14px;font-size:15px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
  .fld input{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--txt);padding:9px 11px;border-radius:9px;font-size:13px;font-family:inherit}
  .mbox .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
  #result{margin-top:12px;font-size:13px;padding:9px 12px;border-radius:9px;display:none}
  #result.ok{display:block;background:rgba(52,224,161,.12);border:1px solid rgba(52,224,161,.3);color:var(--ok)}
  #result.err{display:block;background:rgba(255,92,124,.12);border:1px solid rgba(255,92,124,.3);color:var(--fail)}
</style>
<link rel="stylesheet" href="/static/ds.css">
<script src="/static/sidebar.js"></script>
  <script src="/static/common.js"></script>
</head>
<body>
<div class="lmw-shell"><aside class="sidebar" id="lmw-sidebar"></aside><div class="lmw-content">
<header>
  <a class="btn ghost" href="/">← 返回面板</a>
  <h1>🔐 <span class="ac">密钥保险箱</span></h1>
  <div class="head-sp"></div>
  <button id="btn-add" class="btn">+ 添加密钥</button>
</header>
  <div id="sibnav"></div>

<main>
  <span class="hint">项目级密钥中心 — 为 Agent / Shell 工具提供 API Key、令牌等敏感配置。值以<b>轻量本地加密</b>落盘于 <code>.lmw_secrets.json</code>。</span>
  <div class="warnbox">⚠️ 诚实声明：本保险箱为<b>轻量本地加密</b>（PBKDF2 + 随机盐 + 流密码），可防止文件被意外拷贝/提交时明文泄露，<b>并非操作系统级钥匙串</b>。同机同用户仍可读出，请勿用于高敏感生产密钥（请用环境变量或专用密钥管理服务）。</div>
  <div id="list" class="grid"></div>
  <div id="empty" class="empty" hidden>暂无密钥。点击右上角「+ 添加密钥」。</div>
</main>

<div id="modal" class="modal" hidden>
  <div class="mbox">
    <h3 id="modal-title">添加密钥</h3>
    <div class="fld">
      <label>密钥名称 *（如 OPENAI_API_KEY）</label>
      <input id="f-key" type="text" placeholder="OPENAI_API_KEY" />
    </div>
    <div class="fld">
      <label>明文值 *</label>
      <input id="f-value" type="text" placeholder="sk-..." />
    </div>
    <div class="fld">
      <label>备注</label>
      <input id="f-note" type="text" placeholder="用途说明（可选）" />
    </div>
    <div id="result"></div>
    <div class="foot">
      <button id="btn-cancel" class="btn ghost">取消</button>
      <button id="btn-save" class="btn">保存</button>
    </div>
  </div>
</div>

<script>
const $ = (s, r=document) => r.querySelector(s);
function esc(s){ return LMW.esc(s); }
function showResult(msg, ok){ const el=$("#result"); el.textContent=msg; el.className=ok?"ok":"err"; }
function clearResult(){ $("#result").className=""; $("#result").textContent=""; }

async function loadList() {
  const r = await fetch("/api/secrets");
  const d = await r.json();
  const list = $("#list");
  list.innerHTML = "";
  const items = d.secrets || [];
  $("#empty").hidden = items.length > 0;
  for (const s of items) {
    const div = document.createElement("div");
    div.className = "sec";
    div.innerHTML = `
      <div class="nm">${esc(s.key)}</div>
      ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}
      <div class="acts">
        <button data-act="reveal" data-key="${esc(s.key)}">显隐</button>
        <button data-act="del" data-key="${esc(s.key)}" class="danger">删除</button>
      </div>`;
    list.appendChild(div);
  }
  list.querySelectorAll("button[data-act]").forEach(b => {
    b.addEventListener("click", () => {
      const key = b.dataset.key;
      if (b.dataset.act === "reveal") reveal(key, b);
      else doDelete(key);
    });
  });
}

async function reveal(key, btn) {
  if (btn.dataset.shown === "1") { btn.textContent = "显隐"; btn.dataset.shown = "0"; btn.parentElement.parentElement.querySelector(".note.val")?.remove(); return; }
  const r = await fetch("/api/secrets", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({op:"get", key}) });
  // 这里用专门的取回: 通过 secret_get 走工具不安全, 改为直接解密接口
  const d = await (await fetch("/api/secrets/value?key=" + encodeURIComponent(key))).json();
  if (!d.ok) { alert("取回失败：" + (d.error||"未知")); return; }
  const holder = document.createElement("div");
  holder.className = "note val";
  holder.style.color = "var(--ok)";
  holder.style.fontFamily = "monospace";
  holder.style.wordBreak = "break-all";
  holder.textContent = "值: " + d.value;
  btn.parentElement.parentElement.appendChild(holder);
  btn.textContent = "隐藏"; btn.dataset.shown = "1";
}

async function doDelete(key) {
  if (!confirm("确认删除密钥 " + key + "？")) return;
  const r = await fetch("/api/secrets/delete", {
    method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({key})
  });
  const d = await r.json();
  if (!r.ok) { alert("删除失败：" + (d.error||r.status)); return; }
  loadList();
}

$("#btn-add").addEventListener("click", () => {
  $("#modal-title").textContent = "添加密钥";
  $("#f-key").value=""; $("#f-value").value=""; $("#f-note").value="";
  clearResult(); $("#modal").hidden = false; $("#f-key").focus();
});
$("#btn-cancel").addEventListener("click", () => { $("#modal").hidden = true; });
$("#modal").addEventListener("click", e => { if (e.target === $("#modal")) $("#modal").hidden = true; });

$("#btn-save").addEventListener("click", async () => {
  clearResult();
  const key = $("#f-key").value.trim();
  const value = $("#f-value").value;
  if (!key) { showResult("请填写密钥名称", false); return; }
  try {
    const r = await fetch("/api/secrets", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({key, value, note: $("#f-note").value})
    });
    const d = await r.json();
    if (!r.ok) { showResult("保存失败：" + (d.error||r.status), false); return; }
    showResult("已保存：" + key, true);
    setTimeout(() => { $("#modal").hidden = true; loadList(); }, 500);
  } catch(e) { showResult("保存失败：" + e, false); }
});

loadList();
</script>
  <script src="/static/subnav.js"></script>
  <script src="/static/nav.js"></script>
  <script src="/static/theme.js"></script>
</div></div>
  <script src="/static/commands.js"></script>
</body>
</html>
