<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵梦work · 待办清单</title>
<style>
  :root{
    --bg:#070a14; --bg2:#0e1424; --card:rgba(20,27,48,.62); --card2:#1a2238;
    --line:rgba(126,146,210,.16); --txt:#e9edf8; --mut:#828caa; --acc:#7c5cff;
    --ok:#34e0a1; --warn:#ffb454; --fail:#ff5c7c; --brand2:#4dd0e1;
    --pri-hi:#ff5c7c; --pri-mid:#ffb454; --pri-lo:#4dd0e1;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.5;
    background:
      radial-gradient(1100px 700px at 10% -10%, rgba(124,92,255,.14), transparent 60%),
      radial-gradient(900px 700px at 100% 0%, rgba(77,208,225,.10), transparent 55%),
      var(--bg);
    background-attachment:fixed}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;
    background:rgba(14,20,36,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);position:relative}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(124,92,255,.6),transparent)}
  header h1{font-size:17px;margin:0;font-weight:600}
  header h1 .ac{color:var(--acc)}
  .head-sp{flex:1}
  a.btn{background:linear-gradient(135deg,#7c5cff,#5b8bff);border:1px solid transparent;color:#fff;
    padding:7px 14px;border-radius:9px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block;
    box-shadow:0 6px 20px rgba(124,92,255,.3);transition:transform .14s ease,filter .2s ease}
  a.btn:hover{transform:translateY(-1px);filter:brightness(1.08);border-color:transparent}
  a.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);box-shadow:none}
  a.btn.ghost:hover{border-color:var(--acc);filter:none}
  main{max-width:900px;margin:0 auto;padding:18px 22px 60px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .bar .hint{color:var(--mut);font-size:12px;width:100%}
  .summary{display:flex;gap:10px;margin-bottom:14px}
  .pill{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 6px}
  .pill .n{font-size:20px;font-weight:700}
  .pill .l{font-size:11px;color:var(--mut)}
  .filters{display:flex;gap:8px;margin-bottom:14px}
  .filters button{background:var(--card2);border:1px solid var(--line);color:var(--txt);
    padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px}
  .filters button.active{border-color:var(--acc);color:var(--acc);background:rgba(124,92,255,.12)}
  .add{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:14px}
  .add .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .add input,.add select{background:var(--bg);border:1px solid var(--line);color:var(--txt);
    padding:8px 10px;border-radius:8px;font-size:13px;font-family:inherit}
  .add input[type=text]{flex:1;min-width:200px}
  .add .acts{margin-top:9px;display:flex;gap:8px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;position:relative;overflow:hidden}
  .item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
  .item.pri-high::before{background:var(--pri-hi)} .item.pri-mid::before{background:var(--pri-mid)} .item.pri-low::before{background:var(--pri-lo)}
  .item.done{opacity:.62}
  .item .body{flex:1;min-width:0}
  .item .tt{font-weight:600;font-size:14px;word-break:break-word}
  .item.done .tt{text-decoration:line-through}
  .item .sub{font-size:11px;color:var(--mut);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .badge{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
  .badge.s-todo{color:var(--mut)} .badge.s-doing{color:var(--brand2);border-color:rgba(77,208,225,.3)} .badge.s-done{color:var(--ok);border-color:rgba(52,224,161,.3)}
  .badge.p-high{color:var(--pri-hi);border-color:rgba(255,92,124,.3)} .badge.p-mid{color:var(--pri-mid);border-color:rgba(255,180,84,.3)} .badge.p-low{color:var(--pri-lo);border-color:rgba(77,208,225,.3)}
  .item .acts{display:flex;flex-direction:column;gap:6px;flex:none}
  .item .acts button{background:var(--card2);border:1px solid var(--line);color:var(--txt);
    padding:5px 10px;border-radius:8px;cursor:pointer;font-size:12px;white-space:nowrap}
  .item .acts button:hover{border-color:var(--acc)}
  .item .acts button.danger:hover{border-color:var(--fail);color:var(--fail)}
  .empty{color:var(--mut);text-align:center;padding:40px;border:1px dashed var(--line);border-radius:12px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(20,27,48,.95);
    border:1px solid var(--line);color:var(--txt);padding:10px 18px;border-radius:10px;font-size:13px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transition:opacity .2s ease;pointer-events:none;z-index:80}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <a class="btn ghost" href="/">← 返回面板</a>
  <h1>✅ <span class="ac">待办清单</span></h1>
  <div class="head-sp"></div>
</header>
  <div id="sibnav"></div>

<main>
  <div class="bar">
    <span class="hint">工作区任务清单 — 可让 Agent 在复杂任务前自动列清单、完成后勾掉。数据存于工作区 <code>.lmw_todos.json</code>。</span>
  </div>

  <div class="summary" id="summary">
    <div class="pill"><div class="n" id="c-todo">0</div><div class="l">待办</div></div>
    <div class="pill"><div class="n" id="c-doing">0</div><div class="l">进行中</div></div>
    <div class="pill"><div class="n" id="c-done">0</div><div class="l">已完成</div></div>
  </div>

  <div class="add">
    <div class="row">
      <input type="text" id="a-title" placeholder="新增待办, 如：实现登录接口" />
      <select id="a-priority">
        <option value="high">高优先级</option>
        <option value="mid" selected>中优先级</option>
        <option value="low">低优先级</option>
      </select>
      <input type="text" id="a-due" placeholder="截止日期(可选) 2026-09-01" style="width:170px" />
      <button id="a-add" class="btn">+ 添加</button>
    </div>
  </div>

  <div class="filters" id="filters">
    <button data-f="all" class="active">全部</button>
    <button data-f="todo">待办</button>
    <button data-f="doing">进行中</button>
    <button data-f="done">已完成</button>
  </div>

  <div id="list"></div>
  <div id="empty" class="empty" hidden>清单为空。在上方输入框添加第一条待办。</div>
</main>

<div id="toast" class="toast"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
let filter = "all";

function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }
const STATUS_TXT = {todo:"待办", doing:"进行中", done:"已完成"};
const PRI_TXT = {high:"高", mid:"中", low:"低"};

async function loadList(){
  const r = await fetch("/api/todos");
  const d = await r.json();
  const all = d.todos || [];
  const c = d.counts || {todo:0,doing:0,done:0};
  $("#c-todo").textContent=c.todo; $("#c-doing").textContent=c.doing; $("#c-done").textContent=c.done;
  const list = $("#list");
  list.innerHTML="";
  const view = filter==="all" ? all : all.filter(t=>t.status===filter);
  $("#empty").hidden = view.length>0;
  for (const t of view){
    const div=document.createElement("div");
    div.className="item pri-"+t.priority+(t.status==="done"?" done":"" );
    const due = t.due ? `截止 ${esc(t.due)}` : "";
    const note = t.note ? `备注 ${esc(t.note)}` : "";
    div.innerHTML=`
      <div class="body">
        <div class="tt">${esc(t.title)}</div>
        <div class="sub">
          <span class="badge s-${t.status}">${STATUS_TXT[t.status]||t.status}</span>
          <span class="badge p-${t.priority}">${PRI_TXT[t.priority]||t.priority}优先级</span>
          ${due?`<span>${due}</span>`:""}
          ${note?`<span>${note}</span>`:""}
        </div>
      </div>
      <div class="acts">
        ${t.status!=="doing"?`<button data-act="doing" data-id="${t.id}">开始</button>`:""}
        ${t.status!=="done"?`<button data-act="done" data-id="${t.id}">完成</button>`:""}
        <button data-act="del" data-id="${t.id}" class="danger">删除</button>
      </div>`;
    list.appendChild(div);
  }
  list.querySelectorAll("button[data-act]").forEach(b=>{
    b.addEventListener("click", async ()=>{
      const id=b.dataset.id, act=b.dataset.act;
      if (act==="del"){ if(!confirm("确认删除该待办？")) return; await api("/api/todos/delete",{id}); }
      else if (act==="doing"){ await api("/api/todos/status",{id,status:"doing"}); }
      else if (act==="done"){ await api("/api/todos/status",{id,status:"done"}); }
      loadList();
    });
  });
}

async function api(url, body){
  try{
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){ toast("操作失败："+(d.error||r.status)); return null; }
    return d;
  }catch(e){ toast("请求失败："+e); return null; }
}

$("#a-add").addEventListener("click", async ()=>{
  const title=$("#a-title").value.trim();
  if(!title){ toast("请填写待办标题"); return; }
  const d=await api("/api/todos",{ title, priority:$("#a-priority").value, due:$("#a-due").value.trim()||null });
  if(d){ $("#a-title").value=""; $("#a-due").value=""; toast("已添加"); loadList(); }
});
$("#a-title").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#a-add").click(); });

$("#filters").querySelectorAll("button").forEach(b=>{
  b.addEventListener("click", ()=>{
    filter=b.dataset.f;
    $("#filters").querySelectorAll("button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    loadList();
  });
});

loadList();
</script>
  <script src="/static/subnav.js"></script>
  <script src="/static/theme.js"></script>
</body>
</html>
